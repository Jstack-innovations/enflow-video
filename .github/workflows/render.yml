name: Render
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || true
      - run: npm install
      - run: npx remotion render Launch2D30 out/Launch2D30.mp4 --codec=h264
      - uses: actions/upload-artifact@v4
        with:
          name: Launch2D30
          path: out/Launch2D30.mp4
